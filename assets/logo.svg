<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="skGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62DAEB"/>
      <stop offset="50%" stop-color="#2ED573"/>
      <stop offset="100%" stop-color="#E6C79C"/>
    </linearGradient>
    <linearGradient id="skBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2E2B"/>
      <stop offset="100%" stop-color="#041614"/>
    </linearGradient>
    <filter id="skGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#62DAEB" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Hexagonal / Shield Base -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#skBgGrad)" stroke="url(#skGrad1)" stroke-width="1.8" filter="url(#skGlow)"/>

  <!-- Stylized Monogram S & K Geometry -->
  <!-- 'S' curve path -->
  <path d="M 28 14 C 28 14, 18 13.5, 17 19 C 16 23.5, 27 23, 27 28 C 27 33, 17 33.5, 16 33.5" 
        stroke="url(#skGrad1)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 'K' upright and diagonal arms -->
  <path d="M 31 14 L 31 34" 
        stroke="#E6C79C" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 39 16 L 31 24 L 39 33" 
        stroke="url(#skGrad1)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glowing Accent Dot -->
  <circle cx="16" cy="14" r="2" fill="#62DAEB"/>
</svg>
